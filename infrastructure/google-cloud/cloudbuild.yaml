steps:
  # ── Step 1: Install pnpm ───────────────────────────────────────────────────
  - name: "node:20-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        npm install -g pnpm@8 && pnpm install --frozen-lockfile

  # ── Step 2: TypeScript typecheck ──────────────────────────────────────────
  - name: "node:20-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        npm install -g pnpm@8
        cd apps/api && pnpm typecheck

  # ── Step 3: Run tests ─────────────────────────────────────────────────────
  - name: "node:20-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        npm install -g pnpm@8
        pnpm test --filter @docsetuai/api

  # ── Step 4: Build Docker image for API ────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/docsetuai-api:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/docsetuai-api:latest"
      - -f
      - Dockerfile
      - "."
    env:
      - "DOCKER_BUILDKIT=1"

  # ── Step 5: Push image to Container Registry ──────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/docsetuai-api"

  # ── Step 6: Deploy Firestore rules and indexes ────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: sh
    args:
      - "-c"
      - |
        npm install -g firebase-tools
        firebase deploy --only firestore:rules,firestore:indexes \
          --project $PROJECT_ID \
          --non-interactive

  # ── Step 7: Deploy API to Cloud Run ──────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - run
      - services
      - replace
      - infrastructure/google-cloud/service.yaml
      - --region=us-central1
      - --platform=managed

  # ── Step 8: Set public access (unauthenticated via API key) ──────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - run
      - services
      - add-iam-policy-binding
      - docsetuai-api
      - --member=allUsers
      - --role=roles/run.invoker
      - --region=us-central1

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s

images:
  - "gcr.io/$PROJECT_ID/docsetuai-api:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/docsetuai-api:latest"
